name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Initialize local database
        run: pnpm run db:init

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: file:./prisma/dev.db
          PUBLIC_URL: http://localhost:3417
          APP_SECRET: test-build-secret-test-build-secret
          PORT: 3417

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: reposhare:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint node reposhare:smoke -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.exec('select 1'); console.log('better-sqlite3 ok')"

      - name: Boot smoke-test container
        run: |
          mkdir -p /tmp/reposhare-smoke-data
          docker run -d --name reposhare-smoke \
            -e APP_SECRET=test-build-secret-test-build-secret \
            -e PUBLIC_URL=http://127.0.0.1:3417 \
            -p 3417:3417 \
            -v /tmp/reposhare-smoke-data:/data \
            reposhare:smoke
          trap 'docker logs reposhare-smoke; docker rm -f reposhare-smoke >/dev/null 2>&1 || true; rm -rf /tmp/reposhare-smoke-data' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3417/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "RepoShare container did not become healthy in time."
          exit 1

      - name: Build and optionally push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
