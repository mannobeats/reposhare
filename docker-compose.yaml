# ============================================================
# RepoShare — Docker Compose Configuration
# Usage: docker compose up -d
# ============================================================

services:
  # -- PostgreSQL 18 Database ---------------------------------
  db:
    image: postgres:18-alpine
    container_name: reposhare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reposhare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reposhare_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-reposhare}
    volumes:
      - reposhare_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reposhare}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reposhare-net

  # -- Next.js Application ------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reposhare-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reposhare}:${POSTGRES_PASSWORD:-reposhare_secure_pass}@db:5432/${POSTGRES_DB:-reposhare}
      NEXTAUTH_URL: ${PUBLIC_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reposhare-net

volumes:
  reposhare_data:
    driver: local

networks:
  reposhare-net:
    driver: bridge
